name: Deploy Ticket SLA Calculator

on:
  push:
    branches:
      - main
    paths:
      - "ticket-sla-calculator/**"
      - ".github/workflows/deploy-ticket-sla.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Ticket SLA Calculator
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./ticket-sla-calculator"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4